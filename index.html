<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kamera Absensi JBP</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    html, body { margin:0; min-height:100%; background:#111; color:#fff; }
    body { padding:14px; display:flex; justify-content:center; }
    .camera-wrap { width:100%; max-width:520px; }
    h1 { margin:4px 0 12px; text-align:center; font-size:20px; }
    .info { margin-bottom:10px; padding:10px 12px; border-radius:8px; background:#222; color:#ddd; font-size:13px; line-height:1.45; }
    .video-box { position:relative; width:100%; overflow:hidden; border-radius:12px; background:#000; }
    video { display:block; width:100%; height:auto; min-height:300px; max-height:72vh; object-fit:cover; background:#000; transform:scaleX(-1); }
    .status { margin-top:10px; padding:10px 12px; border-radius:8px; background:#222; color:#ddd; font-size:13px; line-height:1.4; }
    .actions { display:flex; gap:10px; margin-top:12px; }
    button { flex:1; border:0; border-radius:9px; padding:14px 12px; font-size:15px; font-weight:700; cursor:pointer; }
    #capture { background:#1a73e8; color:#fff; }
    #cancel { background:#666; color:#fff; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .error { margin-top:12px; padding:11px; border-radius:8px; background:#f8d7da; color:#721c24; font-size:13px; line-height:1.4; }
    @media (max-width:600px) {
      body { padding:10px; }
      h1 { font-size:18px; }
      video { min-height:260px; max-height:68vh; }
      button { padding:13px 10px; }
    }
  </style>
</head>
<body>
  <main class="camera-wrap">
    <h1>Kamera Absensi JBP</h1>

    <div id="identity" class="info">Menyiapkan kamera...</div>

    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="status" class="status">Meminta akses kamera...</div>

    <div class="actions">
      <button id="capture" type="button" disabled>Ambil foto</button>
      <button id="cancel" type="button">Batal</button>
    </div>

    <div id="error" style="display:none;"></div>
    <canvas id="canvas" style="display:none;"></canvas>
  </main>

<script>
(function () {
  "use strict";

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const captureBtn = document.getElementById("capture");
  const cancelBtn = document.getElementById("cancel");
  const statusBox = document.getElementById("status");
  const identityBox = document.getElementById("identity");
  const errorBox = document.getElementById("error");

  let stream = null;
  let context = null;
  let alreadySent = false;

  function setStatus(text) {
    statusBox.textContent = text;
  }

  function showError(text) {
    errorBox.style.display = "block";
    errorBox.className = "error";
    errorBox.textContent = text;
    setStatus("Kamera belum siap.");
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(function (track) { track.stop(); });
      stream = null;
    }
    video.srcObject = null;
    captureBtn.disabled = true;
  }

  function sendToParent(message) {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(message, "*");
      return true;
    }
    return false;
  }

  function getWaktuJakarta() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Asia/Jakarta",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).formatToParts(now);

    const data = {};
    parts.forEach(function (part) {
      if (part.type !== "literal") data[part.type] = part.value;
    });

    return {
      tanggal: data.day + "/" + data.month + "/" + data.year,
      jam: data.hour + ":" + data.minute + ":" + data.second
    };
  }

  function addWatermark(imageSource) {
    return new Promise(function (resolve, reject) {
      const img = new Image();

      img.onload = function () {
        let width = img.naturalWidth;
        let height = img.naturalHeight;
        const maxWidth = 1200;

        if (width > maxWidth) {
          const ratio = maxWidth / width;
          width = maxWidth;
          height = Math.round(height * ratio);
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const waktu = getWaktuJakarta();
        const line1 = (context.nama || "") + " (" + (context.devisi || "") + ")";
        const line2 = context.status || "";
        const line3 = waktu.tanggal + " " + waktu.jam;

        // Watermark tetap berada DI DALAM area foto.
        const overlayHeight = Math.max(95, Math.round(height * 0.14));
        const overlayY = height - overlayHeight;

        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(0, overlayY, width, overlayHeight);

        // Tulisan dibuat sedikit lebih kecil dari versi sebelumnya.
        let fontSize = Math.round(width / 56);
        fontSize = Math.max(12, Math.min(fontSize, 22));

        const paddingX = Math.max(16, Math.round(width * 0.022));
        const maxTextWidth = width - paddingX * 2;

        function getFittingFontSize(text) {
          let size = fontSize;
          while (size > 12) {
            ctx.font = "600 " + size + "px Arial";
            if (ctx.measureText(text).width <= maxTextWidth) return size;
            size--;
          }
          return 12;
        }

        fontSize = getFittingFontSize(line1);
        ctx.font = "600 " + fontSize + "px Arial";
        ctx.fillStyle = "rgba(255,255,255,0.98)";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        const lineHeight = Math.round(fontSize * 1.28);
        const totalHeight = lineHeight * 3;
        let y = overlayY + (overlayHeight - totalHeight) / 2 + lineHeight / 2;

        ctx.fillText(line1, paddingX, y);
        y += lineHeight;
        ctx.fillText(line2, paddingX, y);
        y += lineHeight;
        ctx.fillText(line3, paddingX, y);

        resolve(canvas.toDataURL("image/jpeg", 0.88));
      };

      img.onerror = function () {
        reject(new Error("Foto tidak dapat diproses."));
      };

      img.src = imageSource;
    });
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      const msg = "Browser ini tidak mendukung kamera realtime. Gunakan Chrome, Edge, Safari, atau Firefox versi terbaru.";
      showError(msg);
      sendToParent({ type: "JBP_CAMERA_ERROR", message: msg });
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "user" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();
      captureBtn.disabled = false;
      setStatus("Kamera aktif. Silakan tekan Ambil foto.");
    } catch (error) {
      console.error(error);
      let msg = "Kamera tidak dapat dibuka. Pastikan izin kamera pada browser sudah diizinkan.";

      if (error && error.name === "NotAllowedError") {
        msg = "Akses kamera ditolak. Izinkan kamera untuk halaman ini, lalu buka kembali kamera.";
      } else if (error && error.name === "NotFoundError") {
        msg = "Kamera tidak ditemukan pada perangkat ini.";
      } else if (error && error.name === "NotReadableError") {
        msg = "Kamera sedang digunakan aplikasi lain. Tutup aplikasi yang sedang memakai kamera, lalu coba lagi.";
      }

      showError(msg);
      sendToParent({ type: "JBP_CAMERA_ERROR", message: msg });
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data || typeof event.data !== "object") return;
    if (event.source !== window.opener) return;

    if (event.data.type === "JBP_CAMERA_CONTEXT") {
      context = {
        nama: String(event.data.nama || "").trim(),
        devisi: String(event.data.devisi || "").trim(),
        status: String(event.data.status || "").trim()
      };

      identityBox.textContent = context.nama + " (" + context.devisi + ") — " + context.status;
      return;
    }
  });

  captureBtn.addEventListener("click", async function () {
    if (alreadySent) return;

    if (!stream || !video.videoWidth || !video.videoHeight) {
      showError("Kamera belum siap. Tunggu sebentar, lalu coba lagi.");
      return;
    }

    if (!context || !context.nama || !context.devisi || !context.status) {
      showError("Data nama, divisi, atau status belum diterima dari halaman absensi.");
      return;
    }

    captureBtn.disabled = true;
    setStatus("Memproses foto dan watermark...");

    const width = video.videoWidth;
    const height = video.videoHeight;
    const maxSize = 1200;
    let w = width;
    let h = height;

    if (w > h && w > maxSize) {
      h = Math.round(h * maxSize / w);
      w = maxSize;
    } else if (h >= w && h > maxSize) {
      w = Math.round(w * maxSize / h);
      h = maxSize;
    }

    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext("2d");

    // Pertahankan tampilan kamera depan seperti versi sebelumnya.
    ctx.save();
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, w, h);
    ctx.restore();

    const fotoAsli = canvas.toDataURL("image/jpeg", 0.90);

    try {
      const hasilFoto = await addWatermark(fotoAsli);
      alreadySent = true;
      stopCamera();
      setStatus("Foto berhasil diambil. Mengembalikan foto ke halaman absensi...");

      const sent = sendToParent({
        type: "JBP_CAMERA_RESULT",
        dataUrl: hasilFoto
      });

      if (!sent) {
        alreadySent = false;
        showError("Halaman absensi tidak ditemukan. Jangan tutup halaman absensi utama.");
        captureBtn.disabled = false;
      } else {
        setTimeout(function () {
          try { window.close(); } catch (e) {}
        }, 300);
      }
    } catch (error) {
      console.error(error);
      alreadySent = false;
      showError(error.message || "Foto gagal diproses.");
      captureBtn.disabled = false;
    }
  });

  cancelBtn.addEventListener("click", function () {
    stopCamera();
    sendToParent({ type: "JBP_CAMERA_CANCEL" });
    try { window.close(); } catch (e) {}
  });

  window.addEventListener("beforeunload", function () {
    stopCamera();
  });

  // Beri tahu halaman absensi bahwa halaman kamera sudah siap.
  if (!window.opener) {
    showError("Halaman kamera harus dibuka dari tombol Buka Kamera pada sistem absensi.");
  } else {
    sendToParent({ type: "JBP_CAMERA_READY" });
    startCamera();
  }
})();
</script>
</body>
</html>
